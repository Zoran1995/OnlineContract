<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Payment Cancelled</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="/css/tailwind.css" rel="stylesheet" />
</head>
<body class="p-6">
  <div class="max-w-xl mx-auto">
    <h1 class="text-2xl font-semibold mb-2">Payment was canceled.</h1>
    <p class="text-gray-700 mb-4">Your order remains in Draft. You can try again or choose Cash on Delivery.</p>
    <div class="flex gap-3">
      <button id="btnTryAgain" class="btn btn-primary">Try again</button>
      <a id="backLink" class="btn" href="/contractshistory">Back to order</a>
    </div>
  </div>
  <script>
    (function(){
      const btn = document.getElementById('btnTryAgain');
      const back = document.getElementById('backLink');
      const cid = parseInt(localStorage.getItem('lastContractId')||'0',10) || 0;
      if (cid) back.href = '/contractshistory/'+cid;
      btn?.addEventListener('click', async () => {
        if (!cid) { window.location.href = '/contractshistory'; return; }
        try {
          const res = await fetch('/api/contracts/'+cid+'/submit?method=online', { method:'POST', credentials:'include', headers:{'Accept':'application/json'} });
          const j = await res.json().catch(()=>({}));
          if (res.ok && j.redirectUrl) {
            try { window.location.href = j.redirectUrl; } catch{}
          } else {
            window.location.href = back.href;
          }
        } catch { window.location.href = back.href; }
      });
    })();
  </script>
</body>
</html>
