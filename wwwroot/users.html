
<!doctype html>
<html lang="en" data-theme="pastel">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KidzStyle · Users & Teams</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.css" rel="stylesheet" />

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link href="/css/login.css" rel="stylesheet" />
  <link href="/css/eventlog.css" rel="stylesheet" />

  <style>
    .hidden { display: none !important; }
    main { max-width: 1200px; margin: 0 auto; }
    .dropdown .dropdown-content { position: absolute; z-index: 10000; }
    .filters { position: relative; overflow: visible; }
  </style>
</head>
<body class="bg-base-200 text-base-content">

  <!-- Navbar (single, sticky) -->
  <div class="navbar bg-base-100 shadow sticky top-0 z-50">
    <div class="flex-1">
      <a href="/home" class="btn btn-ghost normal-case text-xl">
        <span class="material-icons mr-2">home</span> Home
      </a>
      <a href="/about" class="btn btn-ghost">
        <span class="material-icons mr-2">info</span> About
      </a>
      <a href="/address" class="btn btn-ghost">
        <span class="material-icons mr-2">location_on</span> Address
      </a>
      <a href="/eventlog" class="btn btn-ghost">
        <span class="material-icons mr-2">bug_report</span> EventLog
      </a>
    </div>
    <div class="flex-none items-center gap-3">
      <a id="navSignIn" href="/login" class="btn btn-outline"><span class="material-icons mr-2">person_add</span> Sign In</a>
      <a id="navLogIn" href="/login" class="btn btn-primary"><span class="material-icons mr-2">login</span> Log In</a>
    </div>
  </div>

  <main class="container mx-auto p-4">
    <h1 class="text-2xl font-bold mb-4">Users &amp; Teams</h1>

    <!-- Toolbar -->
    <div class="flex items-center gap-2 mb-3 justify-end">
      <button id="btnOpen" class="btn btn-sm" disabled>
        <span class="material-icons">open_in_new</span> <span>Open</span>
      </button>
      <button id="btnNewUser" class="btn btn-sm">
        <span class="material-icons">person_add</span> <span>New User</span>
      </button>
      <button id="btnNewTeam" class="btn btn-sm">
        <span class="material-icons">group_add</span> <span>New Team</span>
      </button>

      <div id="toolbarMenu" class="dropdown dropdown-end" tabindex="0">
        <button id="btnToolbarMenu" class="btn btn-sm btn-ghost" tabindex="0" aria-haspopup="menu" aria-expanded="false">
          <span class="material-icons">more_vert</span>
        </button>
        <ul id="toolbarMenuContent" class="dropdown-content menu p-2 shadow bg-base-100 rounded-box w-40" role="menu" aria-label="Row actions">
          <li><a id="btnDeactivate" role="menuitem"><span class="material-icons mr-2">block</span>Activate/Deactivate</a></li>
          <li><a id="btnDelete" role="menuitem"><span class="material-icons mr-2">delete</span>Delete</a></li>
        </ul>
      </div>
    </div>

    <!-- Filter bar -->
    <section class="bg-base-100 rounded-xl shadow p-4 mb-2">
      <div class="grid grid-cols-1 md:grid-cols-5 gap-4 items-end">
        <div>
          <label class="label"><span class="label-text">Name</span></label>
          <input id="fltName" class="input input-bordered w-full" type="text" placeholder="Search by name/code" />
        </div>
        <div>
          <label class="label"><span class="label-text">Team</span></label>
          <select id="fltTeam" class="select select-bordered w-full">
            <option value="" selected>(All teams)</option>
          </select>
        </div>
        <div class="w-full flex gap-2 justify-end md:col-start-5">
          <button id="btnSearch" class="btn btn-primary"><span class="material-icons mr-2">search</span> Search</button>
          <button id="btnClear" class="btn btn-outline"><span class="material-icons mr-2">clear_all</span> Clear</button>
        </div>
        <div class="text-sm text-gray-500 col-span-1 md:col-span-5">
          <span id="emptyState" class="hidden">No data found for selected filters.</span>
        </div>
      </div>
    </section>

    <!-- Grid -->
    <div class="bg-base-100 rounded-xl shadow p-2 overflow-x-auto">
      <table id="usersTable" class="table table-zebra w-full" aria-label="Users & Teams">
        <thead>
          <tr>
            <th>ID</th>
            <th>Code</th>
            <th>Name</th>
            <th>Role</th>
            <th>Team</th>
            <th>Status</th>
            <th style="width:1%"></th>
          </tr>
        </thead>
        <tbody id="usersBody"></tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="flex items-center gap-3 mt-3">
      <label class="text-sm">Rows per page:</label>
      <select id="pgSize" class="select select-bordered w-32">
        <option value="10" selected>10</option>
        <option value="20">20</option>
        <option value="50">50</option>
        <option value="100">100</option>
      </select>

      <button id="pgPrev" class="btn btn-outline"><span class="material-icons mr-2">chevron_left</span> Previous</button>
      <span id="pgInfo" class="font-semibold"></span>
      <button id="pgNext" class="btn btn-outline">Next <span class="material-icons ml-2">chevron_right</span></button>

      <span id="pageCountInfo" class="page-count-info"></span>
    </div>
  </main>

  <!-- User modal -->
  <dialog id="userModal" class="modal">
    <form method="dialog" class="modal-box">
      <h3 id="userModalTitle" class="font-bold text-lg mb-2">New User</h3>
      <div class="grid grid-cols-2 gap-3">
        <div class="form-control">
          <label class="label"><span class="label-text">Code</span></label>
          <input id="uCode" class="input input-bordered" type="text" />
        </div>
        <div class="form-control">
          <label class="label"><span class="label-text">Role</span></label>
          <select id="uRole" class="select select-bordered">
            <option value="8">Administrator</option>
            <option value="7">Manager</option>
            <option value="6">Worker</option>
            <option value="5" selected>Customer</option>
          </select>
        </div>
        <div class="form-control">
          <label class="label"><span class="label-text">First Name</span></label>
          <input id="uFirst" class="input input-bordered" type="text" />
        </div>
        <div class="form-control">
          <label class="label"><span class="label-text">Last Name</span></label>
          <input id="uLast" class="input input-bordered" type="text" />
        </div>
        <div class="form-control">
          <label class="label"><span class="label-text">Email</span></label>
          <input id="uEmail" class="input input-bordered" type="email" />
        </div>
        <div class="form-control">
          <label class="label"><span class="label-text">Phone</span></label>
          <input id="uPhone" class="input input-bordered" type="text" />
        </div>
        <div class="form-control">
          <label class="label"><span class="label-text">Team (Owner Code)</span></label>
          <select id="uTeamCode" class="select select-bordered">
            <option value=""></option>
          </select>
          <input id="uOwnerId" type="hidden" />
        </div>
        <div class="form-control">
          <label class="label"><span class="label-text">Password</span></label>
          <input id="uPassword" class="input input-bordered" type="password" />
        </div>
      </div>
      <div class="modal-action">
        <button id="userCancel" class="btn">Cancel</button>
        <button id="userSave" class="btn btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Team modal -->
  <dialog id="teamModal" class="modal">
    <form method="dialog" class="modal-box">
      <h3 class="font-bold text-lg mb-2">New Team</h3>
      <div class="grid grid-cols-2 gap-3">
        <div class="form-control">
          <label class="label"><span class="label-text">Team Code</span></label>
          <input id="tCode" class="input input-bordered" type="text" />
        </div>
        <div class="form-control">
          <label class="label"><span class="label-text">Role</span></label>
          <select id="tRole" class="select select-bordered">
            <option value="6" selected>Worker</option>
            <option value="7">Manager</option>
            <option value="8">Administrator</option>
          </select>
        </div>
        <div class="form-control col-span-2">
          <label class="label"><span class="label-text">Full Name</span></label>
          <input id="tFullName" class="input input-bordered" type="text" />
        </div>
        <div class="form-control">
          <label class="label"><span class="label-text">Email</span></label>
          <input id="tEmail" class="input input-bordered" type="email" />
        </div>
        <div class="form-control">
          <label class="label"><span class="label-text">Phone</span></label>
          <input id="tPhone" class="input input-bordered" type="text" />
        </div>
      </div>
      <div class="modal-action">
        <button id="teamCancel" class="btn">Cancel</button>
        <button id="teamSave" class="btn btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Loading overlay & Notification UI -->
  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="loading-box">Loading...</div>
  </div>

  <!-- Redosled je bitan: shared pa users -->
  <script src="/js/shared.js"></script>
  <script src="/js/users.js"></script>
</body>
</html>
