<!DOCTYPE html>
<html lang="en" data-theme="pastel">
<head>
  <meta charset="utf-8" />
  <title>FastRent · Event Logs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
  <link rel="icon" href="/resources/icons/clipboard-list.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/eventlog.css" />
  <link rel="stylesheet" href="/css/login.css" />
</head>
<body class="bg-base-200 text-base-content">

  <!-- Navbar (single, sticky) -->
  <div class="navbar bg-base-100 shadow sticky top-0 z-50">
    <div class="flex-1">
      <a href="/home" class="btn btn-ghost normal-case text-xl">
        <span class="material-icons mr-2">home</span> Home
      </a>
      <a href="/about" class="btn btn-ghost">
        <span class="material-icons mr-2">info</span> About
      </a>
      <a href="/address" class="btn btn-ghost">
        <span class="material-icons mr-2">location_on</span> Address
      </a>
      <a href="/eventlog" class="btn btn-ghost btn-active">
        <span class="material-icons mr-2">bug_report</span> EventLog
      </a>
    </div>
    <div class="flex-none items-center gap-3">
      <a id="navSignIn" href="/login" class="btn btn-outline"><span class="material-icons mr-2">person_add</span> Sign In</a>
      <a id="navLogIn" href="/login" class="btn btn-primary"><span class="material-icons mr-2">login</span> Log In</a>
      <button id="navLogOut" class="btn btn-outline hidden"><span class="material-icons mr-2">exit_to_app</span> Log Out</button>
      <button id="exportBtn" class="btn btn-outline"><span class="material-icons mr-2">file_download</span> Export to CSV</button>
    </div>
  </div>

  <!-- Filters -->
  <section class="container mx-auto p-4">
    <div class="bg-base-100 rounded-xl shadow p-4">
      <div class="grid grid-cols-1 md:grid-cols-5 gap-4 items-end">
        <div>
          <label class="label"><span class="label-text">Type</span></label>
          <select id="typeFilter" class="select select-bordered w-full">
            <option value="0" selected>All</option>
            <option value="1">Information</option>
            <option value="2">Warning</option>
            <option value="3">Error</option>
          </select>
        </div>
        <div>
          <label class="label"><span class="label-text">Date from</span></label>
          <input id="fromDate" type="datetime-local" class="input input-bordered w-full" />
        </div>
        <div>
          <label class="label"><span class="label-text">Date to</span></label>
          <input id="toDate" type="datetime-local" class="input input-bordered w-full" />
        </div>
        <div class="flex gap-2">
          <button id="searchBtn" class="btn btn-primary w-full">Search</button>
          <button id="clearBtn" class="btn btn-outline w-full" disabled>Clear</button>
        </div>
        <div class="text-sm text-gray-500 col-span-1 md:col-span-5">
          <span id="emptyState" class="hidden">No data found for selected filters.</span>
        </div>
      </div>
    </div>
  </section>

  <!-- Grid -->
  <section class="container mx-auto p-4">
    <div class="bg-base-100 rounded-xl shadow p-2 overflow-x-auto">
      <table id="logTable" class="table table-zebra w-full">
        <thead>
          <tr>
            <th>ID</th>
            <th>Type</th>
            <th>Date</th>
            <th>Description</th>
            <th>User</th>
            <th>Stack Trace</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="flex items-center gap-3 mt-3">
      <label class="text-sm">Rows per page:</label>
      <select id="pageSize" class="select select-bordered w-32">
        <option value="10" selected>10</option>
        <option value="20">20</option>
        <option value="50">50</option>
        <option value="100">100</option>
      </select>

      <button id="prevPage" class="btn btn-outline">Previous</button>
      <span id="pageInfo" class="font-semibold"></span>
      <button id="nextPage" class="btn btn-outline">Next</button>

      <span id="pageCountInfo" class="page-count-info"></span>
    </div>
  </section>

  <!-- Loading overlay -->
  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="loading-box">Loading...</div>
  </div>

  <!-- Notification UI injected by /js/shared.js -->

  <script src="/js/shared.js"></script>
  <script src="/js/eventlog.js"></script>
</body>
</html>
