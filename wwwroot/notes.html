<!doctype html>
<html lang="en" data-theme="pastel">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KidzStyle · Notes</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link rel="icon" href="/resources/icons/clipboard-list.svg" type="image/svg+xml" />
  <link href="/css/login.css" rel="stylesheet" />
  <link href="/css/app-modern.css" rel="stylesheet" />
  <link href="/dist/output.css" rel="stylesheet">
  <style>.hidden{display:none!important;} main{max-width:1200px;margin:0 auto;} .dropdown .dropdown-content{position:absolute;z-index:10000;}</style>
</head>
<body class="bg-base-200 text-base-content">
  <div class="navbar bg-base-100 shadow sticky top-0 z-50">
    <div class="flex-1">
      <a href="/home" class="btn btn-ghost normal-case text-xl"><span class="material-icons mr-2">home</span> Home</a>
      <a href="/about" class="btn btn-ghost"><span class="material-icons mr-2">info</span> About</a>
      <a href="/address" class="btn btn-ghost"><span class="material-icons mr-2">location_on</span> Address</a>
      <a href="/eventlog" class="btn btn-ghost"><span class="material-icons mr-2">bug_report</span> EventLog</a>
    </div>
    <div class="flex-none items-center gap-3">
      <a id="navSignIn" href="/login" class="btn btn-outline"><span class="material-icons mr-2">person_add</span> Sign In</a>
      <a id="navLogIn" href="/login" class="btn btn-primary"><span class="material-icons mr-2">login</span> Log In</a>
    </div>
  </div>

  <main class="container mx-auto p-4">
    <div class="mod-toolbar">
      <h1 class="mod-toolbar-title">Notes</h1>
      <div class="mod-toolbar-actions">
        <button id="btnOpen" class="btn btn-sm" disabled><span class="material-icons mr-2">open_in_new</span>Open</button>
        <button id="btnAddNote" class="btn btn-sm btn-outline"><span class="material-icons mr-2">add</span>Add Note</button>
        <div id="notesToolbarMenu" class="dropdown dropdown-end" tabindex="0">
          <button id="btnMore" class="btn btn-sm btn-ghost" tabindex="0" aria-haspopup="menu" aria-expanded="false">
            <span class="material-icons">more_vert</span>
          </button>
          <ul id="notesMoreMenu" class="dropdown-content menu p-2 shadow bg-base-100 rounded-box w-40" role="menu" aria-label="Row actions">
            <li><a id="notesMenuDeactivate" role="menuitem"><span class="material-icons mr-2">block</span>Deactivate</a></li>
            <li><a id="notesMenuDelete" role="menuitem"><span class="material-icons mr-2">delete</span>Delete</a></li>
            <li><a id="notesMenuSetMain" role="menuitem"><span class="material-icons mr-2">star</span>Set as Main</a></li>
          </ul>
        </div>
      </div>
    </div>

    <section class="mod-filters">
      <div class="grid grid-cols-1 md:grid-cols-5 gap-4 items-end">
        <div>
          <label class="label"><span class="label-text">Contract id</span></label>
          <input id="fltContractId" class="input input-sm input-bordered w-full" type="text" placeholder="Contract id" />
        </div>
        <div>
          <label class="label"><span class="label-text">Product id</span></label>
          <input id="fltProductId" class="input input-sm input-bordered w-full" type="text" placeholder="Product id" />
        </div>
        <div class="w-full flex gap-2 justify-end md:col-start-5">
          <button id="btnSearch" class="btn btn-sm btn-primary"><span class="material-icons mr-2">search</span> Search</button>
          <button id="btnClear" class="btn btn-sm btn-outline"><span class="material-icons mr-2">clear_all</span> Clear</button>
        </div>
        <div class="text-sm text-gray-500 col-span-1 md:col-span-5">
          <span id="emptyState" class="hidden">No data found for selected filters.</span>
        </div>
      </div>
    </section>

    <div class="mod-card mod-card-compact table-scroll">
      <table id="notesTable" class="table-modern" aria-label="Notes">
        <thead>
          <tr>
            <th>ID</th>
            <th>Contract Id</th>
            <th>Product Id</th>
            <th>Subject</th>
            <th>Input Date</th>
            <th>Input User</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="mod-pagination">
      <div class="flex items-center gap-2">
        <label class="mod-text-sm">Rows per page:</label>
        <select id="pgSize" class="select select-bordered w-20 select-sm"><option value="10" selected>10</option><option value="20">20</option><option value="50">50</option><option value="100">100</option></select>
      </div>
      <div class="flex items-center gap-2">
        <button id="pgPrev" class="btn btn-outline btn-sm"><span class="material-icons mr-2">chevron_left</span> Previous</button>
        <span id="pgInfo" class="mod-pagination-info"></span>
        <button id="pgNext" class="btn btn-outline btn-sm">Next <span class="material-icons ml-2">chevron_right</span></button>
      </div>
      <span id="pageCountInfo" class="mod-pagination-count"></span>
    </div>
  </main>

  <!-- Add Note modal (simple) -->
  <dialog id="addNoteModal" class="modal">
    <form method="dialog" class="modal-box">
      <h3 id="noteModalTitle" class="font-bold text-lg mb-2">Add Note</h3>
      <input type="hidden" id="editNoteId" />
      <div class="form-control">
        <label class="label"><span class="label-text">Subject</span></label>
        <input id="newSubject" class="input input-bordered w-full" type="text" />
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-2 mt-2">
        <div class="form-control">
          <label class="label"><span class="label-text">Input Date</span></label>
          <input id="noteInputDt" class="input input-bordered w-full" type="text" disabled />
        </div>
        <div class="form-control">
          <label class="label"><span class="label-text">Input User</span></label>
          <input id="noteInputUser" class="input input-bordered w-full" type="text" disabled />
        </div>
        <div class="form-control">
          <label class="label"><span class="label-text">Last Updated</span></label>
          <input id="noteLastUpdatedDt" class="input input-bordered w-full" type="text" disabled />
        </div>
        <div class="form-control">
          <label class="label"><span class="label-text">Last Modified By</span></label>
          <input id="noteLastModifiedBy" class="input input-bordered w-full" type="text" disabled />
        </div>
      </div>
      <div class="form-control mt-2">
        <label class="label"><span class="label-text">Contract Id</span></label>
        <input id="newContractId" class="input input-bordered w-full" type="number" disabled />
      </div>
      <div class="form-control mt-2">
        <label class="label"><span class="label-text">Product Id</span></label>
        <input id="newProductId" class="input input-bordered w-full" type="number" disabled />
      </div>
        <div class="form-control mt-2">
          <label class="label"><span class="label-text">Comment</span></label>
          <textarea id="newComment" class="textarea textarea-bordered w-full" rows="4"></textarea>
        </div>
      <div class="modal-action">
        <button class="btn">Cancel</button>
        <button id="addNoteSave" class="btn btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="/js/shared.js"></script>
  <script src="/js/notes.js"></script>
</body>
</html>
