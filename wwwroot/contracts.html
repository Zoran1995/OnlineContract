
<!DOCTYPE html>
<html lang="en" data-theme="pastel">
<head>
    <meta charset="utf-8" />
    <title>KidzStyle · Contracts</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>

    <link rel="stylesheet" href="/css/eventlog.css" />
    <link rel="stylesheet" href="/css/login.css" />
    <link rel="stylesheet" href="/css/contracts.css" />

    <style>
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-base-200 text-base-content">

    <!-- Navbar (single, sticky) -->
    <div class="navbar bg-base-100 shadow sticky top-0 z-50">
        <div class="flex-1">
            <a href="/home" class="btn btn-ghost normal-case text-xl">
                <span class="material-icons mr-2">home</span> Home
            </a>
            <a href="/about" class="btn btn-ghost">
                <span class="material-icons mr-2">info</span> About
            </a>
            <a href="/address" class="btn btn-ghost">
                <span class="material-icons mr-2">location_on</span> Address
            </a>
            <a href="/eventlog" class="btn btn-ghost">
                <span class="material-icons mr-2">bug_report</span> EventLog
            </a>
        </div>
        <div class="flex-none items-center gap-3">
            <a id="navSignIn" href="/login" class="btn btn-outline"><span class="material-icons mr-2">person_add</span> Sign In</a>
            <a id="navLogIn" href="/login" class="btn btn-primary"><span class="material-icons mr-2">login</span> Log In</a>
            <button id="exportBtn" class="btn btn-outline"><span class="material-icons mr-2">file_download</span> Export CSV</button>
        </div>
    </div>

    <main class="container mx-auto p-4">
        <div class="flex items-center justify-between gap-3 mb-3">
            <h1 class="text-2xl font-bold">Contracts</h1>

            <div class="flex items-center gap-2">
                <button id="btnOpen" class="btn btn-sm" disabled>
                    <span class="material-icons">open_in_new</span> <span>Open</span>
                </button>
            </div>
        </div>

        <!-- Filters -->
        <section class="bg-base-100 rounded-xl shadow p-4 mb-2">
            <div class="grid grid-cols-1 md:grid-cols-5 gap-4 items-end">
                <div>
                    <label class="label"><span class="label-text">Contract state</span></label>
                    <select id="ddlState" class="select select-bordered w-full">
                        <option value="" selected>All states</option>
                        <option>Draft</option>
                        <option>Accepted</option>
                        <option>Partially Accepted</option>
                        <option>Rejected</option>
                        <option>In Progress</option>
                        <option>Completed</option>
                        <option>Dispatched</option>
                        <option>Delivered</option>
                        <option>Returned</option>
                        <option>Cancelled</option>
                        <option>Written Off</option>
                    </select>
                </div>

                <div class="md:col-span-2">
                    <label class="label"><span class="label-text">Customer full name</span></label>
                    <input id="txtName" type="text" class="input input-bordered w-full" placeholder="Search by customer..." />
                </div>

                <div class="w-full flex gap-2 justify-end md:col-start-5">
                    <button id="btnSearch" class="btn btn-primary"><span class="material-icons mr-2">search</span> Search</button>
                    <button id="btnClear" class="btn btn-outline"><span class="material-icons mr-2">clear_all</span> Clear</button>
                </div>

                <div class="text-sm text-gray-500 col-span-1 md:col-span-5">
                    <span id="emptyState" class="hidden">No data found for selected filters.</span>
                </div>
            </div>
        </section>

        <!-- Grid -->
        <div class="bg-base-100 rounded-xl shadow p-2 overflow-x-auto">
            <table id="grid" class="table table-zebra w-full" aria-label="Contracts">
                <thead>
                    <tr>
                        <th style="width:80px">ID</th>
                        <th>Customer Full Name</th>
                        <th style="width:180px">Contract State</th>
                        <th style="width:220px">Entry Date</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="flex items-center gap-3 mt-3">
            <label class="text-sm">Rows per page:</label>
            <select id="pageSize" class="select select-bordered w-32">
                <option value="10" selected>10</option>
                <option value="20">20</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>

            <button id="prevPage" class="btn btn-outline"><span class="material-icons mr-2">chevron_left</span> Previous</button>
            <span id="pageInfo" class="font-semibold"></span>
            <button id="nextPage" class="btn btn-outline">Next <span class="material-icons ml-2">chevron_right</span></button>

            <span id="pageCountInfo" class="page-count-info"></span>
        </div>
    </main>

    <!-- Loading overlay -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="loading-box">Loading...</div>
    </div>

    <!-- Notification UI injected by /js/shared.js -->
    <script src="/js/shared.js"></script>
    <script src="/js/contracts.js"></script>
</body>
</html>
