
<!DOCTYPE html>
<html lang="en" data-theme="pastel">

<head>
    <meta charset="utf-8" />
    <title>KidzStyle · Contracts</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="icon" href="/resources/icons/clipboard-list.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/eventlog.css" />
    <link rel="stylesheet" href="/css/login.css" />
    <link rel="stylesheet" href="/css/contracts.css" />
    <link href="/dist/output.css" rel="stylesheet">
    <style>
        .hidden { display: none !important; }

        /* ===== Small adjustments for the filters toolbar ===== */
        /* Vertically center text inside selects */
        #contractsFilters select {
            padding-top: 8px;
            padding-bottom: 8px;
            -webkit-appearance: none;
            appearance: none;
        }
        /* Unified heights for compact controls */
        #contractsFilters .select.select-sm { height: 36px; }
        #contractsFilters .input.input-sm  { height: 36px; } /* NEW */

        /* Compact widths (on larger screens) */
        #ddlState { width: 11rem; }   /* ~176px */
        #txtName  { width: 16rem; }   /* ~256px */
        #dtFrom, #dtTo { width: 10rem; } /* ~160px */
    </style>
</head>

<body class="bg-base-200 text-base-content">

    <!-- Navbar (single, sticky) -->
    <div class="navbar bg-base-100 shadow sticky top-0 z-50">
        <div class="flex-1">
            <a href="/home" class="btn btn-ghost normal-case text-xl">
                <span class="material-icons mr-2">home</span> Home
            </a>
            <a href="/about" class="btn btn-ghost">
                <span class="material-icons mr-2">info</span> About
            </a>
            <a href="/address" class="btn btn-ghost">
                <span class="material-icons mr-2">location_on</span> Address
            </a>
            <a href="/eventlog" class="btn btn-ghost">
                <span class="material-icons mr-2">bug_report</span> EventLog
            </a>
        </div>
        <div class="flex-none items-center gap-3">
            <a id="navSignIn" href="/login" class="btn btn-outline">
                <span class="material-icons mr-2">person_add</span> Sign In
            </a>
            <a id="navLogIn" href="/login" class="btn btn-primary">
                <span class="material-icons mr-2">login</span> Log In
            </a>
            <button id="exportBtn" class="btn btn-outline">
                <span class="material-icons mr-2">file_download</span> Export CSV
            </button>
        </div>
    </div>

    <main class="container mx-auto p-4">
        <div class="flex items-center justify-between gap-3 mb-3">
            <h1 class="text-2xl font-bold">Contracts</h1>
        </div>

        <!-- Toolbar (above the filters widget) -->
        <div class="flex items-center gap-2 mb-3 justify-end">
            <button id="btnOpen" class="btn btn-sm" disabled>
                <span class="material-icons">open_in_new</span>
                <span>Open</span>
            </button>
            <button id="btnAddContract" class="btn btn-sm">
                <span class="material-icons">add</span>
                <span>Add</span>
            </button>

            <!-- kebab menu removed as per request -->
        </div>

        <!-- Filters -->
        <section id="contractsFilters" class="bg-base-100 rounded-xl shadow p-4 mb-2">
            <!-- CHANGED: items-center -> items-end -->
            <div class="grid grid-cols-12 gap-x-2 gap-y-1 items-end"> <!-- NEW -->
                <!-- All states -->
                <div class="col-span-12 md:col-span-2">
                    <select id="ddlState" class="select select-sm select-bordered w-full md:w-auto">
                        <option value="">All states</option>
                        <option>Draft</option>
                        <option>Accepted</option>
                        <option>Partially Accepted</option>
                        <option>Rejected</option>
                        <option>In Progress</option>
                        <option>Completed</option>
                        <option>Dispatched</option>
                        <option>Delivered</option>
                        <option>Returned</option>
                        <option>Cancelled</option>
                        <option>Written Off</option>
                    </select>
                </div>

                <!-- Customer full name -->
                <div class="col-span-12 md:col-span-3">
                    <input id="txtName" class="input input-sm input-bordered w-full md:w-auto"
                           placeholder="Customer full name" />
                </div>

                <!-- From Date -->
                <div class="col-span-6 md:col-span-2">
                    <label for="dtFrom" class="block text-xs font-medium mb-1">From Date</label>
                    <input id="dtFrom" type="date" class="input input-sm input-bordered w-full md:w-auto" />
                </div>

                <!-- To Date -->
                <div class="col-span-6 md:col-span-2">
                    <label for="dtTo" class="block text-xs font-medium mb-1">To Date</label>
                    <input id="dtTo" type="date" class="input input-sm input-bordered w-full md:w-auto" />
                </div>

                <!-- Actions (right) -->
                <div class="col-span-12 md:col-span-3 flex gap-2 justify-start md:justify-end self-end">
                    <!-- ONLY CHANGE: added icons to Search/Clear -->
                    <button id="btnSearch" class="btn btn-sm btn-primary">
                        <span class="material-icons mr-1 align-middle" aria-hidden="true">search</span>
                        <span class="align-middle">Search</span>
                    </button>
                    <button id="btnClear" class="btn btn-sm">
                        <span class="material-icons mr-1 align-middle" aria-hidden="true">menu</span>
                        <span class="align-middle">Clear</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- Grid -->
        <div class="bg-base-100 rounded-xl shadow p-2 overflow-x-auto">
            <table id="grid" class="table table-zebra w-full" aria-label="Contracts">
                <thead>
                    <tr>
                        <th style="width:80px">ID</th>
                        <th style="width:220px">Customer Full Name</th>
                        <th style="width:120px">Amount</th>
                        <th style="width:180px">Contract State</th>
                        <th style="width:200px">Entry Date</th>
                        <th style="width:180px">Delivered</th>
                        <th style="width:180px">Written Off</th>
                        <th style="width:180px">Rejected</th>
                        <th style="width:180px">Cancelled</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="flex items-center gap-3 mt-3 grid-pagination">
            <label class="text-sm">Rows per page:</label>
            <select id="pageSize" class="select select-bordered w-20 select-sm">
                <option value="10" selected>10</option>
                <option value="20">20</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>

            <button id="prevPage" class="btn btn-outline btn-sm">
                <span class="material-icons mr-2">chevron_left</span>
                Previous
            </button>
            <span id="pageInfo" class="font-semibold"></span>
            <button id="nextPage" class="btn btn-outline btn-sm">
                Next <span class="material-icons ml-2">chevron_right</span>
            </button>

            <span id="pageCountInfo" class="page-count-info"></span>
        </div>
    </main>

    <!-- Loading overlay -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="loading-box">Loading...</div>
    </div>

    <!-- Scripts -->
    <script src="/js/shared.js"></script>
    <script src="/js/contracts.js"></script>
</body>
</html>
