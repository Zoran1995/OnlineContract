<!DOCTYPE html>
<html lang="en" data-theme="pastel">
<head>
  <meta charset="utf-8" />
  <title>KidzStyle · Change Store Details</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
  <link rel="icon" href="/resources/icons/store.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/home.css" />
</head>
<body class="bg-base-200 text-base-content">

  <!-- Navbar (shared.js will manage auth and admin dropdown) -->
  <div class="navbar bg-base-100 shadow sticky top-0 z-50">
    <div class="flex-1">
      <a href="/home" class="btn btn-ghost normal-case text-xl">
        <span class="material-icons mr-2">home</span> Home
      </a>
      <a href="/about" class="btn btn-ghost">
        <span class="material-icons mr-2">info</span> About
      </a>
      <a href="/address" class="btn btn-ghost">
        <span class="material-icons mr-2">location_on</span> Address
      </a>
      <a href="/eventlog" class="btn btn-ghost hidden">
        <span class="material-icons mr-2">bug_report</span> EventLog
      </a>
    </div>
    <div class="flex-none items-center gap-3">
  <a id="navSignIn" href="/login" class="btn btn-outline"><span class="material-icons mr-2">person_add</span> Sign In</a>
  <a id="navLogIn" href="/login" class="btn btn-primary"><span class="material-icons mr-2">login</span> Log In</a>
    </div>
  </div>

  <main class="container mx-auto p-6">
    <section class="bg-base-100 rounded-xl shadow p-4">
      <div id="accessDenied" class="hidden text-center">
        <h1 class="text-3xl font-bold mb-2">Access Denied</h1>
        <p class="text-gray-700">You must be logged in as Manager or Administrator to view store details.</p>
      </div>

      <div id="adminContent" class="hidden">
        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center gap-3">
            <span class="material-icons text-emerald-600">store</span>
            <h1 class="text-2xl font-bold">Store Details</h1>
          </div>
          <div>
            <button id="openStoreBtn" class="btn btn-sm" disabled>
              <span class="material-icons">open_in_new</span>
              <span>Open</span>
            </button>
          </div>
        </div>

        <div class="overflow-x-auto">
          <table class="table table-zebra w-full">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Address</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Last Updated By</th>
              </tr>
            </thead>
            <tbody id="storesTbody">
              <!-- rows injected by JS -->
            </tbody>
          </table>
        </div>

        <div class="flex items-center gap-3 mt-4 grid-pagination">
          <label class="text-sm">Rows per page:</label>
          <select id="pageSize" class="select select-bordered w-20 select-sm">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="25">25</option>
          </select>

          <button id="pgPrev" class="btn btn-outline btn-sm"><span class="material-icons mr-2">chevron_left</span> Previous</button>

          <div id="pgInfo" class="font-semibold">0–0 of 0 · pages 1</div>

          <button id="pgNext" class="btn btn-outline btn-sm">Next <span class="material-icons ml-2">chevron_right</span></button>

          <div style="margin-left:auto" id="pageCountInfo" class="text-sm text-gray-600">Total records: 0</div>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/shared.js"></script>
  <script src="/js/changestore.js"></script>
  <script>
    // Client-side gate: show content only to privileged users
    document.addEventListener('DOMContentLoaded', () => {
      const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
      const roleId = parseInt(localStorage.getItem('roleId') || '0', 10);
      const isPrivileged = isLoggedIn && (roleId === 7 || roleId === 8);
      document.getElementById('adminContent').classList.toggle('hidden', !isPrivileged);
      document.getElementById('accessDenied').classList.toggle('hidden', isPrivileged);
    });
  </script>
  
</body>
</html>
