
<!DOCTYPE html>
<html lang="en" data-theme="pastel">
<head>
  <meta charset="utf-8" />
  <title>KidzStyle · Products</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Tailwind + DaisyUI + Material Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link rel="icon" href="/resources/icons/inventory_2.svg" type="image/svg+xml" />

  <!-- App styles -->
  <link rel="stylesheet" href="/css/eventlog.css" />
  <link rel="stylesheet" href="/css/login.css" />
  <link rel="stylesheet" href="/css/products.css" />

  <style>
    .hidden { display: none !important; }

    /* ===== Small adjustments: compact filters + button alignment ===== */
    /* Height/padding for consistent look (same as Contracts) */
    #productsFilters .select.select-sm,
    #productsFilters .input.input-sm {
      height: 36px;
      padding: 6px 10px;
      font-size: 14px;
      line-height: 1.2;
    }
    /* Dropdown text padding to avoid sitting on the bottom edge */
    #productsFilters select {
      -webkit-appearance: none;
      appearance: none;
      padding-top: 6px;
      padding-bottom: 6px;
    }
    /* Shortened filter widths on larger screens (xs still uses w-full) */
    #fltStore { width: 11rem; }  /* ~176px */
    #fltQuery { width: 16rem; }  /* ~256px */
  </style>
</head>
<body class="bg-base-200 text-base-content">

  <!-- Navbar -->
  <div class="navbar bg-base-100 shadow sticky top-0 z-50">
    <div class="flex-1">
      <a href="/home" class="btn btn-ghost normal-case text-xl">
        <span class="material-icons mr-2">home</span> Home
      </a>
      <a href="/about" class="btn btn-ghost">
        <span class="material-icons mr-2">info</span> About
      </a>
      <a href="/address" class="btn btn-ghost">
        <span class="material-icons mr-2">location_on</span> Address
      </a>
      <a href="/eventlog" class="btn btn-ghost">
        <span class="material-icons mr-2">bug_report</span> EventLog
      </a>
    </div>
    <div class="flex-none items-center gap-3">
      <a id="navSignIn" href="/login" class="btn btn-outline">
        <span class="material-icons mr-2">person_add</span> Sign In
      </a>
      <a id="navLogIn" href="/login" class="btn btn-primary">
        <span class="material-icons mr-2">login</span> Log In
      </a>
    </div>
  </div>

  <main class="container mx-auto p-4">
    <!-- Header: left title, right Open + Add + menu -->
    <div class="flex items-center justify-between gap-3 mb-3">
      <h1 class="text-2xl font-bold">Products</h1>

      <div class="flex items-center gap-2">
        <button id="btnOpen" class="btn btn-sm" disabled>
          <span class="material-icons">open_in_new</span>
          <span>Open</span>
        </button>
        <button id="btnAdd" class="btn btn-sm btn-primary">
          <span class="material-icons">add</span>
          <span>Add Product</span>
        </button>

        <!-- Kebab menu (Activate/Deactivate + Delete) -->
        <div class="dropdown dropdown-end">
          <button class="btn btn-sm btn-ghost" tabindex="0" role="button" aria-label="More">
            <span class="material-icons">more_vert</span>
          </button>
          <ul class="dropdown-content menu p-2 shadow bg-base-100 rounded-box w-52">
            <li class="hidden"><a id="btnDeactivate"><span class="material-icons mr-2">block</span>Deactivate</a></li>
            <li><a id="btnDelete"><span class="material-icons mr-2">delete</span>Delete</a></li>
          </ul>
        </div>
      </div>
    </div>

    <!-- Filters: Name + Store (compact); Search/Clear aligned to the far right -->
    <section id="productsFilters" class="mb-3">
      <div class="grid grid-cols-12 gap-x-2 gap-y-1 items-center">
        <!-- Name -->
        <div class="col-span-12 md:col-span-3">
          <label for="fltQuery" class="sr-only">Name</label>
          <input id="fltQuery" class="input input-sm input-bordered w-full md:w-auto"
                 placeholder="Search by name" />
        </div>

        <!-- Store -->
        <div class="col-span-12 md:col-span-2">
          <label for="fltStore" class="sr-only">Store</label>
          <select id="fltStore" class="select select-sm select-bordered w-full md:w-auto">
            <!-- Populated by products.js: loadStores() -->
            <option value="">All Stores</option>
          </select>
        </div>

        <!-- Actions: right-aligned like on Contracts -->
        <div class="col-span-12 md:col-span-7 flex gap-2 justify-start md:justify-end">
          <button id="btnSearch" class="btn btn-sm btn-primary">
            <span class="material-icons mr-1 align-middle" aria-hidden="true">search</span>
            <span class="align-middle">Search</span>
          </button>
          <button id="btnClear" class="btn btn-sm">
            <span class="material-icons mr-1 align-middle" aria-hidden="true">menu</span>
            <span class="align-middle">Clear</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Empty state -->
    <div id="emptyState" class="hidden">No data found for selected filters.</div>

    <!-- Grid -->
    <div class="bg-base-100 rounded-xl shadow p-2 overflow-x-auto">
      <table id="grid" class="table table-zebra w-full" aria-label="Products">
        <thead>
          <tr>
            <th style="width:80px">ID</th>
            <th>Name</th>
            <th style="width:220px">Input Date</th>
            <th style="width:140px">Store 1 Qty</th>
            <th style="width:140px">Store 2 Qty</th>
            <th style="width:120px">Status</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="flex items-center gap-3 mt-3 grid-pagination">
      <label class="text-sm">Rows per page:</label>
      <select id="pageSize" class="select select-bordered w-20 select-sm">
        <option value="10" selected>10</option>
        <option value="20">20</option>
        <option value="50">50</option>
        <option value="100">100</option>
      </select>

      <button id="prevPage" class="btn btn-outline btn-sm">
        <span class="material-icons mr-2">chevron_left</span>
        Previous
      </button>
      <span id="pageInfo" class="font-semibold">Page 1 of 1</span>
      <button id="nextPage" class="btn btn-outline btn-sm">
        Next <span class="material-icons ml-2">chevron_right</span>
      </button>

      <span id="pageCountInfo" class="page-count-info ml-auto">Total records: 0</span>
    </div>
  </main>

  <!-- Loading overlay -->
  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="loading-box">Loading...</div>
  </div>

  <!-- Scripts -->
  <script src="/js/shared.js"></script>
  <script src="/js/products.js"></script>
</body>
</html>
