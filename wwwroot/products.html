<!DOCTYPE html>
<html lang="en" data-theme="pastel">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KidzStyle · Products</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link rel="icon" href="/resources/icons/tshirt.svg" type="image/svg+xml" />

  <link href="/css/login.css" rel="stylesheet" />
  <link href="/css/eventlog.css" rel="stylesheet" />

  <style>
    .hidden { display: none !important; }
    main { max-width: 1200px; margin: 0 auto; }
    .dropdown .dropdown-content { position: absolute; z-index: 10000; }
  </style>
</head>
<body class="bg-base-200 text-base-content">

  <!-- Navbar (single, sticky) -->
  <div class="navbar bg-base-100 shadow sticky top-0 z-50">
    <div class="flex-1">
      <a href="/home" class="btn btn-ghost normal-case text-xl">
        <span class="material-icons mr-2">home</span> Home
      </a>
      <a href="/about" class="btn btn-ghost">
        <span class="material-icons mr-2">info</span> About
      </a>
      <a href="/address" class="btn btn-ghost">
        <span class="material-icons mr-2">location_on</span> Address
      </a>
      <a href="/eventlog" class="btn btn-ghost">
        <span class="material-icons mr-2">bug_report</span> EventLog
      </a>
    </div>
    <div class="flex-none items-center gap-3">
      <a id="navSignIn" href="/login" class="btn btn-outline"><span class="material-icons mr-2">person_add</span> Sign In</a>
      <a id="navLogIn" href="/login" class="btn btn-primary"><span class="material-icons mr-2">login</span> Log In</a>
    </div>
  </div>

  <main class="container mx-auto p-4">
    <h1 class="text-2xl font-bold mb-4">Products</h1>

    <!-- Toolbar -->
    <div class="flex items-center gap-2 mb-3 justify-end">
      <button id="btnOpen" class="btn btn-sm" disabled>
        <span class="material-icons">open_in_new</span> <span>Open</span>
      </button>
      <button id="btnAdd" class="btn btn-sm">
        <span class="material-icons">add</span> <span>Add Product</span>
      </button>

      <div id="toolbarMenu" class="dropdown dropdown-end" tabindex="0">
        <button id="btnToolbarMenu" class="btn btn-sm btn-ghost" tabindex="0" aria-haspopup="menu" aria-expanded="false">
          <span class="material-icons">more_vert</span>
        </button>
        <ul id="toolbarMenuContent" class="dropdown-content menu p-2 shadow bg-base-100 rounded-box w-40" role="menu" aria-label="Row actions">
          <li><a id="btnDeactivate" role="menuitem"><span class="material-icons mr-2">block</span>Activate/Deactivate</a></li>
          <li><a id="btnDelete" role="menuitem"><span class="material-icons mr-2">delete</span>Delete</a></li>
        </ul>
      </div>
    </div>

    <!-- Filter bar -->
    <section class="bg-base-100 rounded-xl shadow p-4 mb-2">
      <div class="flex flex-col md:flex-row gap-4 items-end">
        <div class="w-full md:w-80">
          <label class="label"><span class="label-text">Name</span></label>
          <input id="fltQuery" class="input input-bordered w-full" type="text" placeholder="Search by name/description" />
        </div>
        <div class="w-full md:w-64">
          <label class="label"><span class="label-text">Store</span></label>
          <select id="fltStore" class="select select-bordered w-full">
            <option value="" selected>All Stores</option>
          </select>
        </div>
        <div class="w-full md:w-auto md:ml-auto flex gap-2 justify-end">
          <button id="btnSearch" class="btn btn-primary"><span class="material-icons mr-2">search</span> Search</button>
          <button id="btnClear" class="btn btn-outline"><span class="material-icons mr-2">clear_all</span> Clear</button>
        </div>
      </div>
      <div class="text-sm text-gray-500 mt-2">
        <span id="emptyState" class="hidden">No data found for selected filters.</span>
      </div>
    </section>

    <!-- Grid -->
    <div class="bg-base-100 rounded-xl shadow p-2 overflow-x-auto">
      <table id="grid" class="table table-zebra w-full" aria-label="Products">
        <thead>
          <tr>
            <th style="width:120px">ID</th>
            <th>Name</th>
            <th>Description</th>
            <th style="width:220px">Input Date</th>
            <th style="width:140px">Store 1 Qty</th>
            <th style="width:140px">Store 2 Qty</th>
            <th style="width:160px">Status</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="flex items-center gap-3 mt-3">
      <label class="text-sm">Rows per page:</label>
      <select id="pageSize" class="select select-bordered w-32">
        <option value="10" selected>10</option>
        <option value="20">20</option>
        <option value="50">50</option>
        <option value="100">100</option>
      </select>

      <button id="prevPage" class="btn btn-outline"><span class="material-icons mr-2">chevron_left</span> Previous</button>
      <span id="pageInfo" class="font-semibold"></span>
      <button id="nextPage" class="btn btn-outline">Next <span class="material-icons ml-2">chevron_right</span></button>

      <span id="pageCountInfo" class="page-count-info"></span>
    </div>
  </main>

  <!-- Loading overlay -->
  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="loading-box">Loading...</div>
  </div>

  <!-- Notification UI injected by /js/shared.js -->
  <script src="/js/shared.js"></script>
  <script src="/js/products.js"></script>
</body>
</html>
