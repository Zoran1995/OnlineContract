<!doctype html>
<html lang="en" data-theme="pastel">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.css" rel="stylesheet" />
  <link href="/css/login.css" rel="stylesheet" />
</head>
<body class="bg-base-200 text-base-content">
  <main class="container mx-auto p-6">
    <section class="max-w-lg mx-auto bg-base-100 shadow rounded-xl p-6">
      <h2 class="text-2xl font-bold mb-4 text-center">Reset Password</h2>
      <p id="resetMsg" class="text-center text-sm mb-4">Loading...</p>
      <div id="resetForm" class="hidden">
        <div class="form-control mb-3">
          <label class="label"><span class="label-text">Username (Code)</span></label>
          <input id="rpCode" class="input input-bordered" type="text" readonly />
        </div>
        <div class="form-control mb-3">
          <label class="label"><span class="label-text">New Password</span></label>
          <input id="rpNew" class="input input-bordered" type="password" />
        </div>
        <div class="form-control mb-3">
          <label class="label"><span class="label-text">Confirm Password</span></label>
          <input id="rpConfirm" class="input input-bordered" type="password" />
        </div>
        <div class="flex justify-center gap-3 mt-4">
          <button id="rpSubmit" class="btn btn-primary">Change Password</button>
          <a href="/login" class="btn btn-outline">Cancel</a>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/shared.js"></script>
  <script src="/js/reset-password.js"></script>
</body>
</html>
